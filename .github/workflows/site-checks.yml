name: Site checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tests/check-content.py
      - run: python3 tests/test-profile.py
      - run: python3 tests/check-identity.py
      - run: python3 tests/check-world-logos.py
      - run: node --check site.js
      - run: node --check world-atlas.js
      - run: node --check mina.js
      - run: node --check mina-points.js
      - run: python3 tests/check-mina.py
  browser:
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install playwright==1.56.0 Pillow==12.0.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: test -x "$CHROMIUM_PATH" # Chrome is included in the hosted Ubuntu image.
      - run: npm install --no-save --ignore-scripts --package-lock=false axe-core@4.10.3
      - run: AXE_PATH=node_modules/axe-core/axe.min.js python3 tests/test-site.py
      - run: python3 tests/test-details.py

      - run: python3 tests/test-world-atlas.py
      - run: AXE_PATH=node_modules/axe-core/axe.min.js python3 tests/test-mina.py
      - if: ${{ !cancelled() }}
        run: python3 tools/capture-screenshots.py
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 3
