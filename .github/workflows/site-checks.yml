name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tests/check-content.py
      - run: node --check site.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install playwright==1.56.0 Pillow==12.0.0
      - run: python3 -m playwright install --with-deps chromium
      - run: npm install --no-save --ignore-scripts --package-lock=false axe-core@4.10.3
      - run: AXE_PATH=node_modules/axe-core/axe.min.js python3 tests/test-site.py
      - run: python3 tests/test-details.py
